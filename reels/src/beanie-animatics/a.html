const K1=knit(s1.svg,{x0:0,y0:560,w:1080,h:1360,cols:12,rows:16,color:'#D8323F',needles:false});

textOut('h1',h1,2.05);hide([s1.id,PB.id],2.4);

/* S2 2.4-5.6 YARN */

  const th=el('path',{d:`M${cx},1205 C${cx},1000 ${540+(i-1.5)*90},980 ${540+(i-1.5)*90},790`,fill:'none',stroke:c==YARN.black?'#55575E':c,'stroke-width':6,pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},s2.svg);

el('path',{d:'M90,1440 Q140,1420 190,1440 T290,1440 T390,1440 T490,1440',fill:'none',stroke:RED,'stroke-width':5},xs);
let hv='M590,1460';for(let i=0;i<8;i++){const x=590+i*50;hv+=` C${x},1380 ${x+50},1380 ${x+50},1460`;}el('path',{d:hv,fill:'none',stroke:CYAN,'stroke-width':12,'stroke-linecap':'round'},xs);

const C=crown(s4.svg,{x:540,y:980,s:1.35});

const g1=tag('g1','Gathered + stitched','left:80px;top:1520px','w');tagIn(g1,10.9);

tl.to(M.cav,{attr:{'stroke-dashoffset':0},duration:.4},14.45);
tl.set(M.st,{pour:1,pourX:-180},14.7);tl.to(M.st,{pourX:180,duration:.8},14.7);tl.to(M.st,{logo:1,duration:.75,ease:'power1.in'},14.75);sfx(14.7,'pour',.7);
tl.set(M.st,{pourX:-180},15.55);tl.to(M.st,{pourX:180,duration:.6},15.55);tl.to(M.st,{base:1,duration:.6,ease:'power1.in'},15.55);tl.set(M.st,{pour:0},16.15);

tl.set(fly,{opacity:1},17.1);const FS={k:0};tl.to(FS,{k:1,duration:.36,ease:'expo.in'},17.1);FRAME.push(()=>{const k=FS.k;fp.setAttribute('transform',`translate(0,${-900*(1-k)}) rotate(${-25*(1-k)}) scale(${1.6-.6*k})`);});
