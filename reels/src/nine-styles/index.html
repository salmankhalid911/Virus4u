{const disc=new THREE.Mesh(new THREE.CylinderGeometry(.32,.32,.05,40),new THREE.MeshStandardMaterial({color:0xdfe6ea,metalness:.9,roughness:.2}));disc.rotation.z=Math.PI/2;disc.position.y=.32;cutter.add(disc);
